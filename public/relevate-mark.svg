<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Relevate logo mark">
  <defs>
    <linearGradient id="rel-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <!-- House is a negative-space cutout inside the leaf; the door stays leaf-colored -->
    <mask id="rel-house-mask">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <path d="M24 35 L32 26.5 L40 35 L40 48.5 L24 48.5 Z" fill="#000"/>
      <rect x="28.8" y="40" width="6.4" height="8.5" rx="1" fill="#fff"/>
    </mask>
  </defs>

  <!-- Leaf silhouette -->
  <path mask="url(#rel-house-mask)"
        d="M32 3 C43 3 54.5 17 51.5 33 C49.2 45.5 41.5 54.5 32 54.5 C22.5 54.5 14.8 45.5 12.5 33 C9.5 17 21 3 32 3 Z"
        fill="url(#rel-leaf)"/>

  <!-- Central vein (stays inside the leaf, avoids the house cutout) -->
  <path mask="url(#rel-house-mask)"
        d="M32 8.5 C30.5 20 30.5 34 32 47"
        fill="none" stroke="#d1fae5" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Wood stem -->
  <path d="M32 54.5 L32 60.5" stroke="#8a5a3b" stroke-width="2.6" stroke-linecap="round"/>
</svg>
