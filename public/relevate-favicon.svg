<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Relevate favicon">
  <defs>
    <linearGradient id="rel-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="30%" stop-color="#34d399"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <mask id="rel-house-mask">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <path d="M24 35 L32 26.5 L40 35 L40 48.5 L24 48.5 Z" fill="#000"/>
      <rect x="28.8" y="40" width="6.4" height="8.5" rx="1" fill="#fff"/>
